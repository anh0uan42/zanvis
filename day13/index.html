<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,
        initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Strichpunkt+Sans:wght@400..900&display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
        <title>Calculator</title>
    </head>
    <body>
        <h1>Calulator</h1>
        <div class="input-value" id="input-value">
            <label for="value1" >Value 1</label>
            <input type="number" class="value1" id="value1" />
            <br>
            <label for="value2" >Value 2</label>
            <input type="number" class="value2" id="value2" />
        </div>
        <div class="method" id="method">
            <button onclick="add()">Addition</button>
            <button onclick="subtract()">Subtraction</button>
            <button onclick="multiply()">Multiply</button>
            <button onclick="division()">Division</button>
        </div>
        <h3>Result <span class="result" id="result"></span></h3>
    </body>
</html>
