<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,
        initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Strichpunkt+Sans:wght@400..900&display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
        <title>Students</title>
    </head>
    <body>
        <h1>Students</h1>
        <section>
            <h3>List of students</h3>
            <ol class="student-list" id="student-list">

            </ol>
        </section>
        <section>
            <h3>Add Student</h3>
            <label for="fullname">Student Fullname</label>
            <input type="text" id="fullname" />
            <br>
            <button id="add-student">Add Student</button>
        </section>
        <section>
            <h3>Styling button</h3>
            <button id="red-text">Text Red</button>
            <button id="change-font">Change Font</button>
            <button id="text-bold">Text Bold</button>
            <button id="background">Add Background Color</button>
        </section>
        <section>
            <h3>Replace Text</h3>
            <p>You can change this text</p>
            <p class="text-change" id="text-change">This is a original text</p>
            <button id="change-text">Change</button>
        </section>
    </body>
</html>
