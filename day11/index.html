<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,
        initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Strichpunkt+Sans:wght@400..900&display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
        <script>
            function getPwd() {
                let pwd = prompt("Please enter your password:", 'Password');
                
                if (pwd) {
                    enroll()
                    alert(`Enroll successfully`)
                } else {
                    alert(`Please enter password`)
                }
            }
        </script>
        <title>Talented School</title>
    </head>
    <body>
        <header>
            <h1>Talented School</h1>
        </header>
        <main>
            <section>
                <h2>Enrollment</h2>
                <div class="student-info">
                    <h3>Your Student Information</h3>
                    <form>
                        <label for="fullname"> Your Full Name</label>
                        <input type="text" class="fullname" id="fullname" name="fullname" />
                        <br>
                        <label for="studentid">Student Id</label>
                        <input type="number" class="studentid" name="studentid" id="studentid" />
                        <br>
                        <label for="email">Your student email</label>
                        <input type="text" class="email" id="email" name="email" />
                        <br>
                    </form>
                </div>
                <div class="course-data">
                    <h3>Available Courses and Instructor</h3>
                    <form>
                        <label for="courses">Choose your courses:</label>
                        <select name="courses" id="courses">
                            <option value="science">Science</option>
                            <option value="art">Art</option>
                            <option value="business">Business</option>
                        </select>
                        <br>

                        <label for="instructor">Choose your Instructor:</label>
                        <select name="instructor" id="instructor">
                            <option value="johnsmith">John Smith</option>
                            <option value="lucygray">Lucy Gray</option>
                            <option value="erikgreene">Erik Greene</option>
                        </select>
                    </form>
                </div>
                <button onclick="getPwd()">Enroll</button>
            </section>
        </main>
    </body>
</html>
