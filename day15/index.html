<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,
        initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Strichpunkt+Sans:wght@400..900&display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
        <title>Events</title>
    </head>
    <body>
        <h1>Events</h1>
        <section class="button-event" id="button-event">
            <button id="click">Button</button>
            <p class="event-type" id="event-type"></p>
        </section>
        <section class="input-event" id="input-event">
            <h3>Your Student Information</h3>
            <form>
                <label for="firstname">First Name</label>
                <input type="text" class="firstname" id="firstname" name="firstname" />
                <br>
                <label for="lastname">Last Name</label>                        <input type="lastname" class="lastname" name="lastname" id="lastname" />
                <br>
                <label for="middlename">Middle Name</label>
                <input type="middlename" class="middlename" name="middlename" id="middlename" />
                <br>
            </form>
            <div>
                <h3>Welcome back!<span class="fullname" id="fullname"></span></h3>
            </div>
        </section>
        <section class="form-event" id="form-event">
            <h3>Sign in</h3>
            <form action="submit" id="sign-in">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" />
                <br>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" />
                <br>
                <button type="submit">Submit</button>
            </form>
        </section>
        <section class="toggle-event" id="toggle-event">
            <h3>Toggle Event</h3>
            <button id="toggle-p">Show Paragraph</button>
            <p class="hidden" id="hidden">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
        </section>
        <section class="counter">
            <h3>Counter</h3>
            <h4>Count: <span id="count">0</span></h4>
            <button id="subtract">-</button> <button id="add">+</button>
        </section>
        <section class="todo" id="todo">
            <h3>Todo</h3>
            <div>
                <label for="todo-input">Add Todo</label>
                <input type="text" id="todo-input" />
                <br>
                <button id="add-todo">Add Todo</button>
            </div>
            <ul id="todo-list"></ul>
        </section>
    </body>
</html>
