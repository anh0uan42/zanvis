<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,
        initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Strichpunkt+Sans:wght@400..900&display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
        <title>Expense</title>
    </head>
    <body>
        <div class="container">
        <h1>Expense Tracker</h1>
        
        <div class="balance-container">
            <p>Your Balance</p>
            <h2 id="balance">$0.00</h2>
        </div>

        <div class="summary-box">
            <div class="summary-item">
                <p>Income</p>
                <span id="income-total" class="income-amt">+$0.00</span>
            </div>
            <div class="summary-item">
                <p>Expense</p>
                <span id="expense-total" class="expense-amt">-$0.00</span>
            </div>
        </div>

        <form id="transaction-form">
            <div class="form-group">
                <label for="text">Description</label>
                <input type="text" id="text" placeholder="Enter description..." required />
            </div>
            <div class="form-group">
                <label for="type">Transaction Type</label>
                <select id="type">
                    <option value="inc">Income</option>
                    <option value="exp">Expense</option>
                </select>
            </div>
            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" required />
            </div>
            <button type="submit">Add Transaction</button>
        </form>

        <div class="history-container">
            <h3>History</h3>
            <ul id="transaction-list" class="transaction-list">
            </ul>
        </div>
    </div>
    </body>
</html>
